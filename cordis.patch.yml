# Mount this plugin's host row into a dsh profile.
#
# The visible feature (the rich text editor and the code surface) lives in the
# browser half. A package is only scanned for a browser half when it is mounted as
# a host row, so this row exists even though the host half is deliberately thin: it
# registers the `ping`/`probe`/`open`/`save`/`report`/`diag` endpoints under this
# plugin's own `/api/dsh-sidebar-editor` prefix, which is how both views read and
# write a file and how a save keeps its freshness token.
#
# Nothing else has to be mounted for this plugin to work.
- insert:
    - id: sidebar-editor
      name: 'dsh-sidebar-editor'
